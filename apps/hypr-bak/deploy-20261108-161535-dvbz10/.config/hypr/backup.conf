# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

no_hardware_cursors = true

$mainMod = Mod1
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# Input method configuration
env = QT_IM_MODULE, fcitx
env = XMODIFIERS, @im=fcitx
env = SDL_IM_MODULE, fcitx
env = INPUT_METHOD, fcitx

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -i -p "Clipboard" | cliphist decode | wl-copy
# bind = $mainMod SHIFT, V, exec, cliphist list | rofi -dmenu | cliphist delete
bind = $mainMod SHIFT, V, exec, ~/.local/bin/snippet-manager.sh

bind = $mainMod, TAB, workspace, previous
bind = $mainMod, R, submap, resize
bind = $mainMod, T, exec, ~/projects/linux-apps/todo/todo-popup
# bind = $mainMod, T, exec, ~/.local/bin/todo-popup 
bind = $mainMod, H, exec, /home/arch_Kang/projects/hermes/scripts/hermes-popup

# Switch to workspaces 1 - 5 using SUPER + [1-5]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Quick window workspace assignments
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Swap window positions with adjacent tiles using SUPER + SHIFT + Arrows
bind = $mainMod SHIFT, left,  swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up,    swapwindow, u
bind = $mainMod SHIFT, down,  swapwindow, d

# Left-Click and Drag to move a floating window anywhere
bindm = $mainMod, mouse:272, movewindow

# Right-Click and Drag to resize a floating window on the fly
bindm = $mainMod, mouse:273, resizewindow

# Laptop Brightness Keys
binde = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Tap SUPER + Escape to bring up the interactive Rofi power menu
bind = $mainMod, Y, exec, ~/.local/bin/sys-power

# Take a screenshot of a region using grim/slurp
bind = $mainMod, P, exec, grim -g "$(slurp)" - | wl-copy

submap = resize

binde = , right, resizeactive, 20 0
binde = , left, resizeactive, -20 0
binde = , up, resizeactive, 0 -20
binde = , down, resizeactive, 0 20

binde = SHIFT, right, resizeactive, 5 0
binde = SHIFT, left, resizeactive, -5 0
binde = SHIFT, up, resizeactive, 0 -5
binde = SHIFT, down, resizeactive, 0 5

bind = , escape, submap, reset
submap = reset

# Volume Control (WirePlumber)
# b = bind, e = repeat when held, l = locked (works when screen is locked)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
# exec-once = swww-daemon
# exec-once = dunst
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = swaybg -i /home/arch_Kang/Downloads/wallpaper.jpg -m fill
exec-once = swaync
# exec-once = ~/.config/hypr/scripts/battery-monitor.sh
exec-once = fcitx5 -d
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user start waybar.service


# Assign workspaces to specific programs
windowrule = match:class = ^(code-oss)$, workspace 1
windowrule = match:class = ^(kitty)$, workspace 2
windowrule = match:class = ^(firefox)$, workspace 3
windowrule = match:class = ^(thunar)$, workspace 4

windowrule = match:title = ^(todo)$, float true
windowrule = match:title = ^(todo)$, size 320 820
windowrule = match:title = ^(todo)$, move onscreen 100%-340 40
windowrule = match:title = ^(todo)$, pin true

windowrule = match:title = ^(hermes-popup)$, float true
windowrule = match:title = ^(hermes-popup)$, size 320 820
windowrule = match:title = ^(hermes-popup)$, move onscreen 100%-340 40
windowrule = match:title = ^(hermes-popup)$, pin true

cursor {
    no_hardware_cursors = true
}

monitor=,preferred,auto,1.2

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 3
    
    # Premium color matching for window borders
    col.active_border = rgb(0066ff) rgb(ff6600) rgb(ff00cc) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2.0

    shadow {
        enabled = false
        range = 25
        render_power = 4
        color = rgba(6f00ff55)        
        color_inactive = rgba(1a1a1a55)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
}

animations {
    enabled = true
    bezier = linear, 0.0, 0.0, 1.0, 1.0
#   animation = borderangle, 1, 30, linear, loop
}

